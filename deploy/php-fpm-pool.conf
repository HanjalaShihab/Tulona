; Tulona PHP-FPM pool — written by deploy/bootstrap.sh to
; /etc/php/8.3/fpm/pool.d/tulona.conf
;
; The app runs entirely as www-data so cron, the queue worker and the web
; server all see the same files (incl. the SQLite database).

[tulona]
user = www-data
group = www-data

; Caddy's php_fastcgi talks to this socket
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
; Ceiling sized to fit even the 1 GB AMD shape (A1 Arm has far more headroom)
pm.max_children = 6
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

; Admin image uploads
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 24M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120

php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On